# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: test

on:
  push:
    branches:
      - master
      - release
  workflow_dispatch:
  # release:
  #   types: [published]
permissions:
  id-token: write # Required for OIDC
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm

      - run: pnpm i --frozen-lockfile
      - run: pnpm lint
      - run: pnpm coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true # optional (default = false)
          files: ./coverage1.xml,./coverage2.xml # optional
          flags: unittests # optional
          name: codecov-umbrella # optional
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true # optional (default = false)

  publish-npm:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - run: npm install -g npm@latest
      - name: Publish to npm
        run: npm publish --access public

      - name: 获取 commit message
        id: commit
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: 提取 release note
        id: note
        run: |
          msg="${{ steps.commit.outputs.message }}"

          note=$(echo "$msg" | awk '/\[release-note\]/ {flag=1; next} flag')

          if [ -z "$note" ]; then
            echo "note=详细信息请参阅 [CHANGELOG-CN.md](https://github.com/TerryZ/v-region/blob/dev/CHANGELOG-CN.md)" >> $GITHUB_OUTPUT
          else
            echo "note<<EOF" >> $GITHUB_OUTPUT
            echo "$note" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Create Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          body: |
            ${{ steps.note.outputs.note }}
          draft: false
          prerelease: false
