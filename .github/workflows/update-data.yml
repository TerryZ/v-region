name: Update data

on:
  # 允许在 Github Action 界面上手动触发
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout dev 分支
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0 # 获取完整的提交历史，以便进行版本比较

      - name: 设置 Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: 拉取数据源
        run: |
          git clone --depth 1 https://github.com/mumuy/data_location.git tmp-data

      - name: 更新数据
        run: |
          rm -rf src/data/*
          mkdir -p src/data/town
          cp tmp-data/code/* src/data/town
          cp tmp-data/list.json src/data/data.json
          rm -rf tmp-data

      - name: 检查是否有变更
        id: check
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新版本号 & dataVersion
        id: versioning
        if: steps.check.outputs.changed == 'true'
        env:
          TZ: Asia/Shanghai
        run: |
          # 递增 patch 版本号，不自动创建 Git 标签或提交
          npm version patch --no-git-tag-version

          # 生成数据更新时间 dataVersion
          DATA_VERSION=$(date +%F)

          # 更新 package.json 中的 dataVersion
          DATA_VERSION="$DATA_VERSION" node <<'NODE'
            const fs = require('node:fs');

            const file = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));

            pkg.dataVersion = process.env.DATA_VERSION;

            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          # 更新 README.md 中的 dataVersion
          DATA_VERSION="$DATA_VERSION" node <<'NODE'
            const fs = require('node:fs');

            const file = 'README.md';
            let content = fs.readFileSync(file, 'utf8');

            const pattern = /<!-- DATA_VERSION -->[\s\S]*?<!-- DATA_VERSION_END -->/;

            if (!pattern.test(content)) {
              throw new Error('README.md 中未找到 DATA_VERSION 标记');
            }

            content = content.replace(
              pattern,
              `<!-- DATA_VERSION -->\`${process.env.DATA_VERSION}\`<!-- DATA_VERSION_END -->`
            );

            fs.writeFileSync(file, content);
          NODE

          # 导出给后续步骤
          echo "dataVersion=$DATA_VERSION" >> "$GITHUB_OUTPUT"

      - name: 提交到 dev
        if: steps.check.outputs.changed == 'true'
        env:
          DATA_VERSION: ${{ steps.versioning.outputs.dataVersion }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "chore: sync region data & bump version" \
            -m "[release-note]
          行政区划数据源更新至：${DATA_VERSION}"

          git push origin dev

      - name: 合并到 master
        if: steps.check.outputs.changed == 'true'
        run: |
          # 获取最新的远程分支
          git fetch origin master dev

          # 基于远程 master 创建本地分支
          git checkout -B master origin/master

          # 要求 dev 可以快进合并到 master
          git merge --ff-only origin/dev

          # 推送 master
          git push origin master

      - name: 触发 npm publish
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh workflow run npm-publish.yml \
            --ref master
